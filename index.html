<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading lesson…</title></head>
<body>
<script>
(async()=>{
  const parts=[];
  for(let i=1;i<=12;i++){
    const name=`parts/app-${String(i).padStart(2,'0')}.txt`;
    const r=await fetch(name);
    if(!r.ok) throw new Error(`Could not load ${name}`);
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch(err=>{document.body.innerHTML='<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">'+err.message+'</pre>';});
</script>
</body>
</html>
